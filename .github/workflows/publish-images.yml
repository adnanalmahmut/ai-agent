name: Publish immutable images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      PUBLISH_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The minimum host-bundle version is read from the file rather than
      # restated here, and exported so bake stamps it onto every image in the
      # release set. A release that cannot say which host it needs is a release
      # the host cannot refuse.
      - name: Declare the release host requirement
        run: |
          minimum=$(sed -n '1p' ops/host-bundle/MIN_VERSION)
          printf '%s\n' "$minimum" | grep -Eq '^[1-9][0-9]*$'
          printf 'HOST_BUNDLE_MIN_VERSION=%s\n' "$minimum" >>"$GITHUB_ENV"

      - name: Build and push one release set
        run: docker buildx bake --file docker-bake.hcl --push release

      - name: Record immutable image digests
        run: |
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          mkdir -p release
          backend=$(docker buildx imagetools inspect "$REGISTRY/backend:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          migration=$(docker buildx imagetools inspect "$REGISTRY/backend-migration:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          web=$(docker buildx imagetools inspect "$REGISTRY/web:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          platform=$(docker buildx imagetools inspect "$REGISTRY/platform:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson ciRunId "$CI_RUN_ID" \
            --argjson publishRunId "$PUBLISH_RUN_ID" \
            --argjson hostBundleMinVersion "$HOST_BUNDLE_MIN_VERSION" \
            --arg backend "$REGISTRY/backend@$backend" \
            --arg migration "$REGISTRY/backend-migration@$migration" \
            --arg web "$REGISTRY/web@$web" \
            --arg platform "$REGISTRY/platform@$platform" \
            '{schemaVersion:2,repository:$repository,sourceWorkflow:"CI",ciRunId:$ciRunId,publishWorkflow:"Publish immutable images",publishRunId:$publishRunId,sha:$sha,hostBundleMinVersion:$hostBundleMinVersion,backend:$backend,migration:$migration,web:$web,platform:$platform}' \
            >release/image-digests.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson ciRunId "$CI_RUN_ID" \
            --argjson publishRunId "$PUBLISH_RUN_ID" \
            --argjson hostBundleMinVersion "$HOST_BUNDLE_MIN_VERSION" \
            '.schemaVersion == 2 and .repository == $repository and .sourceWorkflow == "CI" and .ciRunId == $ciRunId and .publishWorkflow == "Publish immutable images" and .publishRunId == $publishRunId and .sha == $sha and .hostBundleMinVersion == $hostBundleMinVersion and (.hostBundleMinVersion | type) == "number" and ([.backend,.migration,.web,.platform] | all(test("^ghcr\\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")))' \
            release/image-digests.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ env.SOURCE_SHA }}
          path: release/image-digests.json
          if-no-files-found: error
          retention-days: 90
