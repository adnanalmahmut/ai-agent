name: Publish immutable images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      PUBLISH_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push one release set
        run: docker buildx bake --file docker-bake.hcl --push release

      - name: Record immutable image digests
        run: |
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          mkdir -p release
          backend=$(docker buildx imagetools inspect "$REGISTRY/backend:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          migration=$(docker buildx imagetools inspect "$REGISTRY/backend-migration:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          web=$(docker buildx imagetools inspect "$REGISTRY/web:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          platform=$(docker buildx imagetools inspect "$REGISTRY/platform:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson ciRunId "$CI_RUN_ID" \
            --argjson publishRunId "$PUBLISH_RUN_ID" \
            --arg backend "$REGISTRY/backend@$backend" \
            --arg migration "$REGISTRY/backend-migration@$migration" \
            --arg web "$REGISTRY/web@$web" \
            --arg platform "$REGISTRY/platform@$platform" \
            '{schemaVersion:1,repository:$repository,sourceWorkflow:"CI",ciRunId:$ciRunId,publishWorkflow:"Publish immutable images",publishRunId:$publishRunId,sha:$sha,backend:$backend,migration:$migration,web:$web,platform:$platform}' \
            >release/image-digests.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --argjson ciRunId "$CI_RUN_ID" \
            --argjson publishRunId "$PUBLISH_RUN_ID" \
            '.schemaVersion == 1 and .repository == $repository and .sourceWorkflow == "CI" and .ciRunId == $ciRunId and .publishWorkflow == "Publish immutable images" and .publishRunId == $publishRunId and .sha == $sha and ([.backend,.migration,.web,.platform] | all(test("^ghcr\\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")))' \
            release/image-digests.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ env.SOURCE_SHA }}
          path: release/image-digests.json
          if-no-files-found: error
          retention-days: 90
