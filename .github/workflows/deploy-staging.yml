name: Deploy staging

on:
  workflow_run:
    workflows: [Publish immutable images]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Publish immutable images'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.DEPLOYMENT_URL }}
    env:
      PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
    steps:
      # Fetched from the publish run by name pattern, not by artifact id, so
      # the v5 change to single-artifact-by-id extraction paths does not apply.
      # Two defaults are load-bearing and deliberately not overridden:
      # `skip-decompress` stays false because the next step reads the extracted
      # JSON, and `digest-mismatch` stays `error` so a manifest that does not
      # match the server hash stops the deployment instead of configuring one.
      - name: Download publish digest manifest
        uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          merge-multiple: true
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # The manifest reader, taken from the repository rather than restated in
      # each workflow. It is the allowlist -- the thing that decides which
      # component names and repositories a manifest may name -- so it is read
      # from the same place this workflow file itself is read from, and never
      # from anything the artifact points at. Sparse and into its own path, so
      # it cannot disturb the downloaded manifest.
      - name: Check out the release manifest reader
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra/release
          sparse-checkout-cone-mode: false
          path: .reader

      - name: Validate immutable release metadata
        run: |
          test "$VPS_USER" = deploy
          test -n "$VPS_HOST"
          printf '%s\n' "$DEPLOYMENT_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'
          test "$(find release -type f -name image-digests.json | wc -l)" -eq 1
          manifest=release/image-digests.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson publishRunId "$PUBLISH_RUN_ID" \
            '(.schemaVersion == 2 or .schemaVersion == 3) and .repository == $repository and .sourceWorkflow == "CI" and .publishWorkflow == "Publish immutable images" and .publishRunId == $publishRunId and (.hostBundleMinVersion | type) == "number" and .hostBundleMinVersion >= 1' \
            "$manifest" >/dev/null

          release_sha=$(jq -r .sha "$manifest")
          printf '%s\n' "$release_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf 'RELEASE_SHA=%s\n' "$release_sha" >>"$GITHUB_ENV"

          # One reader for both manifest formats. Version 2 is the flat
          # four-field manifest every release so far published; version 3 lists
          # components. Both are normalised to one component list, which is then
          # validated against the catalog before a single digest is exported,
          # so nothing after this point knows or cares which format arrived.
          jq -r --arg registry "ghcr.io/$GITHUB_REPOSITORY" \
            -f .reader/infra/release/manifest.jq "$manifest" >>"$GITHUB_ENV"

      - name: Install restricted SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy migration-gated release
        run: |
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$VPS_USER@$VPS_HOST" "deploy staging $RELEASE_SHA $BACKEND_DIGEST $BACKEND_MIGRATION_DIGEST $WEB_DIGEST $PLATFORM_DIGEST"

      - name: Verify restricted host health
        run: |
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$VPS_USER@$VPS_HOST" "health staging"

      - name: External HTTPS smoke tests
        run: |
          curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/platform/" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/api/health/ready" >/dev/null

      - name: Record successful staging evidence
        run: |
          jq \
            --arg workflow 'Deploy staging' \
            --argjson stagingRunId "$GITHUB_RUN_ID" \
            '. + {stagingWorkflow:$workflow,stagingRunId:$stagingRunId}' \
            release/image-digests.json >release/staging-success.json
          jq -e \
            --arg sha "$RELEASE_SHA" \
            --argjson stagingRunId "$GITHUB_RUN_ID" \
            '.sha == $sha and .stagingWorkflow == "Deploy staging" and .stagingRunId == $stagingRunId' \
            release/staging-success.json >/dev/null

      # `archive` must stay at its default. Setting it to false uploads the file
      # unzipped and ignores `name`, deriving the artifact name from the
      # filename — which would rename this artifact to `staging-success.json`
      # and break the production promotion gate, which looks it up by the exact
      # name `staging-success-<sha>`.
      - name: Upload staging release evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-success-${{ env.RELEASE_SHA }}
          path: release/staging-success.json
          if-no-files-found: error
          retention-days: 90
