# The merge gate for `apps/backend`.
#
# Everything here is verify-only. No step writes to the repository, no step
# carries a `--fix` flag, and no step reaches an external provider: a pipeline
# that repairs its own input cannot tell you whether what you pushed was
# correct, and one that needs a third-party API key fails for reasons that have
# nothing to do with the change under review.
#
# The dependency-bearing steps run against service containers rather than
# mocks, because the things most worth catching here — a migration that does
# not apply, a queue connection that never becomes ready — are invisible to a
# suite that stubs the dependency out.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded pull-request run tells nobody anything, so it releases its
# runner to the revision that is actually being waited on. Pushes to `main`
# are deliberately not cancelled: cancelling one would leave the branch
# without a verdict for that commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Nothing in this workflow publishes, comments, or
# pushes, so nothing here needs a token that could.
permissions:
  contents: read

jobs:
  agent-harness:
    name: agent harness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate portable agent harness
        run: pnpm agents:check

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Mirrors the `postgres-test` service in infra/compose/compose.yaml,
      # including its credentials, so a failure reproduces locally with
      # `docker compose --profile test up -d postgres-test redis-test`.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backend_test_user
          POSTGRES_PASSWORD: backend_test_password
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_test_user -d backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Mirrors the `redis-test` compose service. The compose file pins
      # `maxmemory-policy noeviction` explicitly; here it is inherited, since
      # an unconfigured Redis has no `maxmemory` limit and therefore already
      # evicts nothing. Service containers take no command, so the guarantee is
      # asserted by the test suite instead of restated here.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points at the service containers above. Both suites and
      # `prisma migrate deploy` read these.
      DATABASE_URL: postgresql://backend_test_user:backend_test_password@localhost:5432/backend_test
      REDIS_URL: redis://localhost:6379
      # Obviously fake, and only ever encrypts throwaway fixtures. The control
      # plane requires a master key at boot, so the suites cannot construct the
      # application without one.
      APP_ENCRYPTION_KEY: dGVzdC1vbmx5LWZha2UtbWFzdGVyLWtleS0zMmJ5dGU=
      APP_ENCRYPTION_ACTIVE_KEY_VERSION: test-v1
      APP_ENCRYPTION_DECRYPT_KEYS: ''

      # Boot-time configuration the e2e suites need in order to construct the
      # real `AppModule`. These are throwaway CI values, not secrets: the
      # secret only has to satisfy the 32-character minimum, and no signed
      # artifact outlives the job.
      BETTER_AUTH_SECRET: ci-better-auth-secret-value-0000000000
      BETTER_AUTH_URL: http://localhost:3002/api/auth
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      APP_PLATFORM_URL: http://localhost:3001/platform

      # `log` records metadata and sends nothing. The e2e harness substitutes
      # the transport anyway; this only has to satisfy validation at boot.
      MAIL_DRIVER: log
      MAIL_FROM_ADDRESS: no-reply@example.test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate container topology
        run: |
          infra/scripts/compose.sh --profile development config >/dev/null
          infra/scripts/compose.sh --profile test config >/dev/null
          infra/scripts/compose.sh --profile staging --profile migration config >/dev/null
          ops/tests/container-foundation.sh
          ops/tests/compose-interface.sh
          ops/tests/container-environment.sh
          ops/tests/runtime-preflight.sh
          ops/tests/nginx-real-ip.sh
          ops/tests/lightsail-boundary.sh
          ops/tests/deploy-service-health.sh
          ops/tests/image-publishing.sh
          ops/tests/staging-cd.sh
          ops/tests/production-cd.sh
          ops/tests/artifact-contract.sh
          ops/tests/release-manifest.sh
          ops/tests/host-bundle.sh
          ops/tests/release-retention.sh
          ops/tests/backup-recovery.sh
          ops/tests/restore-drill-safety.sh
          ops/tests/documentation.sh

      # Before setup-node, so its pnpm store cache has a package manager to
      # locate. The version comes from `packageManager` in the root manifest.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` is the point of this step: it fails when the
      # lockfile and the manifests disagree, which is the one dependency
      # problem that a passing local install will happily hide.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend imports `@repo/i18n-core` through its build output, so the
      # workspace packages have to exist before anything type-checks. The root
      # `prepare` script already does this on install; repeated here so the
      # ordering is a stated requirement rather than a side effect.
      - name: Build workspace packages
        run: pnpm run build:packages

      # Validate before generate: an invalid schema should be reported as a
      # schema error, not as whatever the generator happens to do with it.
      - name: Validate Prisma schema
        run: pnpm --filter backend run prisma:validate

      # The generated client is committed, so this step is not about producing
      # it — it is about proving the committed copy is what the schema says it
      # should be. A stale client type-checks perfectly against the code that
      # was written for it and fails only at runtime, on a column the adapter
      # cannot find.
      - name: Generate Prisma client
        run: pnpm --filter backend run prisma:generate

      # A generated client that differs from the committed one means the schema
      # changed without regenerating. Failing here says so plainly, instead of
      # letting the rest of the run pass against a client nobody has reviewed.
      - name: Check the committed Prisma client is current
        run: git diff --exit-code -- apps/backend/src/generated/prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Unit tests
        run: pnpm --filter backend run test

      # `migrate deploy` applies committed migrations and never generates one,
      # which is what makes it the right command here: a schema change pushed
      # without its migration fails the e2e step below instead of being
      # silently papered over by `migrate dev`.
      - name: Apply migrations
        run: pnpm --filter backend run db:deploy

      - name: E2E tests
        run: pnpm --filter backend run test:e2e

      # Last, and not redundant with the typecheck: `nest build` runs a
      # different tsconfig and also copies the i18n assets, so it can fail on a
      # translation file that `tsc --noEmit` never looks at.
      - name: Build
        run: pnpm --filter backend run build

  platform:
    name: platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      # The Knowledge types the Platform compiles against are generated from
      # the Backend's OpenAPI document, so a contract change that was not
      # regenerated has to fail here rather than type-check cleanly against a
      # stale artifact. Generation reads Nest route metadata in preview mode:
      # no server, no database, no Redis, no credentials — which is why this
      # step belongs in this job and not one with service containers.
      - name: Check the committed Application API types are current
        run: pnpm api:types:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter platform run lint

      - name: Lint shared UI
        run: pnpm --filter @repo/ui run lint

      - name: Unit and component tests
        run: pnpm --filter platform test -- --run

      - name: Build
        run: pnpm --filter platform run build

      # The smoke fixture intercepts every API call, so this needs neither the
      # backend service container nor a provider credential. It does need a
      # real Chromium: reload, URL state and sessionStorage are browser facts.
      - name: Install Chromium for browser smoke
        run: pnpm --filter platform exec playwright install --with-deps chromium

      - name: Browser smoke tests
        env:
          PLATFORM_E2E_PORT: '43173'
          PLATFORM_E2E_API_PORT: '43174'
        run: pnpm --filter platform run test:e2e

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact production image targets without pushing
        run: docker buildx bake --file docker-bake.hcl release

      - name: Load backend targets used by the degraded-startup test
        run: |
          docker buildx build --load --file apps/backend/Dockerfile --target runtime --tag ghcr.io/adnanalmahmut/ai-agent/backend:development .
          docker buildx build --load --file apps/backend/Dockerfile --target migration --tag ghcr.io/adnanalmahmut/ai-agent/backend-migration:development .

      - name: Prove the API starts while Redis is unavailable
        run: |
          runtime_file="$RUNNER_TEMP/container-runtime.env"
          {
            echo 'NODE_ENV=staging'
            echo 'POSTGRES_USER=app'
            echo 'POSTGRES_PASSWORD=test-only-container-password'
            echo 'POSTGRES_DB=app'
            echo 'DATABASE_URL=postgresql://app:test-only-container-password@postgres:5432/app'
            echo 'REDIS_URL=redis://redis:6379'
            echo 'APP_ENCRYPTION_KEY=dGVzdC1vbmx5LWZha2UtbWFzdGVyLWtleS0zMmJ5dGU='
            echo 'APP_ENCRYPTION_ACTIVE_KEY_VERSION=test-v1'
            echo 'APP_ENCRYPTION_DECRYPT_KEYS='
            echo 'BETTER_AUTH_SECRET=test-only-better-auth-secret-000000000000'
            echo 'BETTER_AUTH_URL=http://localhost:3002/api/auth'
            echo 'BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:3000'
            echo 'APP_PLATFORM_URL=http://localhost:3001/platform'
            echo 'MAIL_DRIVER=log'
            echo 'MAIL_FROM_ADDRESS=no-reply@example.test'
            echo 'GOOGLE_AUTH_ENABLED=false'
          } >"$runtime_file"
          infra/scripts/compose.sh --env-file "$runtime_file" --profile staging --profile migration up -d --wait postgres
          infra/scripts/compose.sh --env-file "$runtime_file" --profile staging --profile migration run --rm migrate
          infra/scripts/compose.sh --env-file "$runtime_file" --profile staging up -d --no-deps backend
          attempts=0
          until curl --fail --silent --show-error http://127.0.0.1:3002/api/health/live >/dev/null; do
            attempts=$((attempts + 1))
            [ "$attempts" -lt 30 ] || exit 1
            sleep 2
          done
          test -n "$(infra/scripts/compose.sh --env-file "$runtime_file" --profile staging ps -q backend)"
          test -z "$(infra/scripts/compose.sh --env-file "$runtime_file" --profile staging ps -q redis)"

      - name: Stop verification containers
        if: always()
        run: |
          runtime_file="$RUNNER_TEMP/container-runtime.env"
          test ! -f "$runtime_file" || infra/scripts/compose.sh --env-file "$runtime_file" --profile staging stop backend postgres

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Lint
        run: pnpm --filter web run lint

      - name: Tests
        run: pnpm --filter web run test

      - name: Build
        run: pnpm --filter web run build
