name: ai-agent

# The shared half of the Compose model.
#
# Everything in this file is true of the datastores in every environment. What
# is true of only one — the development credential defaults, the throwaway CI
# databases, the application services a host runs — lives in the overlay for
# that composition and nowhere else, so no setting is stated twice and none can
# reach a composition it was not written for.
#
# This file is never used on its own. infra/scripts/compose.sh merges it with
# exactly one of compose.dev.yaml, compose.test.yaml, or compose.deploy.yaml,
# picked from the requested profile. A caller cannot name the files itself and
# cannot combine two overlays, so "which composition is this?" has one answer
# per command.
#
# `postgres` and `redis` keep their deployment profiles here rather than in the
# overlays: the profiles are what stops the shared datastores from activating
# under `--profile test`, which is the half of test isolation a project name
# cannot provide.

services:
  postgres:
    profiles: [development, staging, production]
    # pgvector, not stock PostgreSQL: knowledge retrieval stores embeddings in a
    # `vector` column, and the extension is absent from `postgres:16-alpine`.
    # There is no Alpine variant, so this is a Debian image where the previous
    # one was musl. The data directory is binary-compatible for the same major,
    # but the two libcs sort text differently under the same locale name and
    # musl records no collation version — so PostgreSQL emits no mismatch
    # warning and every text btree index is silently left in the wrong order.
    # An existing volume therefore needs `REINDEX DATABASE` followed by
    # `ALTER DATABASE ... REFRESH COLLATION VERSION`, by an operator, once.
    # See docs/deployment.md.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edge
      - data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    profiles: [development, staging, production]
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    networks:
      - edge
      - data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
