services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-backend_dev_postgres}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend_network

    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-256m}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-test:
    profiles:
      - test

    image: postgres:16-alpine
    container_name: ${POSTGRES_TEST_CONTAINER_NAME:-backend_test_postgres}
    restart: 'no'

    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-backend_test_user}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-backend_test_password}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-backend_test}

    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'

    tmpfs:
      - /var/lib/postgresql/data

    networks:
      - backend_network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Coordination and queue transport. Never the source of truth: every durable
  # agent fact lives in PostgreSQL, and this holds only stream buffers,
  # rate-limit windows, short-lived locks and BullMQ's own job structures.
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-backend_dev_redis}
    restart: unless-stopped

    # Two settings that are not defaults anywhere they matter, so they are
    # stated rather than assumed:
    #
    #   maxmemory-policy noeviction  BullMQ's job hashes, its wait/active lists
    #                                and its stream keys are all ordinary keys.
    #                                Under any eviction policy Redis is free to
    #                                delete a queued job to reclaim memory, and
    #                                the job does not come back — the loss is
    #                                silent and looks like a worker that never
    #                                ran. `noeviction` converts that into a
    #                                write error the producer can see.
    #   appendonly yes               A restart must not vaporise the jobs that
    #                                were already accepted. RDB snapshots alone
    #                                lose everything since the last save.
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'

    ports:
      - '${REDIS_PORT:-6379}:6379'

    volumes:
      - redis_data:/data

    networks:
      - backend_network

    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-64m}

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The suites' Redis, on its own port so a test run can never reach into the
  # development instance and flush it.
  #
  # Persistence is off here, unlike above: a test Redis that survives a restart
  # is a test Redis carrying state between runs. `noeviction` is kept, because
  # the suites assert that queued jobs are not silently discarded and that
  # assertion is only meaningful against the production policy.
  redis-test:
    profiles:
      - test

    image: redis:7-alpine
    container_name: ${REDIS_TEST_CONTAINER_NAME:-backend_test_redis}
    restart: 'no'

    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'no'
      - --save
      - ''

    ports:
      - '${REDIS_TEST_PORT:-6378}:6379'

    networks:
      - backend_network

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

networks:
  backend_network:
    driver: bridge
