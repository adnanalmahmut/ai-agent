server {
    listen 8080;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /platform/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /platform/index.html;
    }

    location / {
        return 404;
    }
}
